<main class="account-page"><section class="account-shell single-account"><div class="account-card"><p class="section-kicker">Choose a new password</p><h1>Set a fresh password</h1><p class="account-lead">Enter the code sent to your email and choose a password with at least 8 characters.</p>{{AUTH_MESSAGE}}<form class="auth-form" action="/reset-password" method="post"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Verification code<input name="token" inputmode="numeric" autocomplete="one-time-code" required></label><label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label><button class="auth-submit" type="submit">Update password <i class="bi bi-check2"></i></button></form></div></section></main>
