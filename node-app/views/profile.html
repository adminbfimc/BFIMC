<main class="profile-page"><section class="profile-shell"><div class="profile-heading"><p class="section-kicker">My account</p><h1>Hello, {{FIRST_NAME}}.</h1><p>Manage your personal details and account security in one place.</p></div>{{AUTH_MESSAGE}}<div class="profile-grid"><aside class="profile-summary"><span class="profile-avatar">{{FIRST_NAME}}</span><h2>{{FIRST_NAME}} {{LAST_NAME}}</h2><p>{{EMAIL}}</p><span class="profile-status"><i class="bi bi-patch-check-fill"></i> BFIMC account</span></aside><div class="profile-settings"><section class="settings-card"><div><p class="section-kicker">Personal details</p><h2>Your profile</h2></div><form class="profile-form" action="/profile/details" method="post"><div class="auth-grid"><label>First name<input name="first_name" value="{{FIRST_NAME}}" required></label><label>Last name<input name="last_name" value="{{LAST_NAME}}" required></label><label>Birthdate<input name="birthdate" type="date" value="{{BIRTHDATE}}" required></label><label>Gender<select name="gender" required><option {{GENDER_FEMALE}}>Female</option><option {{GENDER_MALE}}>Male</option><option {{GENDER_PREFER_NOT_TO_SAY}}>Prefer not to say</option></select></label></div><label>Email<input value="{{EMAIL}}" disabled></label><button class="auth-submit" type="submit">Save changes <i class="bi bi-check2"></i></button></form></section><section class="settings-card"><div><p class="section-kicker">Account security</p><h2>Change password</h2></div><form class="profile-form" action="/profile/password" method="post"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><div class="auth-grid"><label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label></div><button class="auth-submit" type="submit">Update password <i class="bi bi-lock"></i></button></form></section></div></div></section></main>
